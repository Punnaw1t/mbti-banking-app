# Local database for Meridian.
#   docker compose up -d        start Postgres (+ Adminer UI) and Ollama (free local LLM)
#   docker compose down -v      stop and wipe the data volume
#
# Host ports are 5433 / 8082 so they don't clash with a Postgres or
# other service already running on the machine's default 5432 / 8080 / 8081.
services:
  db:
    image: postgres:16-alpine
    container_name: meridian-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      - "5433:5432"
    volumes:
      - meridian-pgdata:/var/lib/postgresql/data
      # Runs once, on the first start with an empty volume (alphabetical order).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Web UI to browse the tables: http://localhost:8082
  # System: PostgreSQL · Server: db · User/Password/Database: meridian
  adminer:
    image: adminer:4
    container_name: meridian-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

  # Free, local LLM for the HR Assistant chatbot (OpenAI-compatible API on :11434).
  # Runs on CPU inside Docker; see README for using a native/GPU install instead.
  ollama:
    image: ollama/ollama:0.12.6
    container_name: meridian-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - meridian-ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m        # keep the model in memory between questions
      OLLAMA_CONTEXT_LENGTH: "8192" # room for the HR data the chatbot sends
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot job: downloads the chat model (~1.9 GB, first run only) then exits.
  ollama-pull:
    image: ollama/ollama:0.12.6
    container_name: meridian-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen2.5:3b}"]
    restart: "no"

volumes:
  meridian-pgdata:
  meridian-ollama:
